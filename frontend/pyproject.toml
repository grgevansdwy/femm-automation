[project]
name = "frontend"
version = "0.0.1"
requires-python = ">=3.13"
dependencies = [
    "imgui-bundle>=1.6",
    "numpy>=2.5.2",
]

[project.scripts]
femm = "frontend.main:main"

[dependency-groups]
test = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/frontend"]
